<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Data Engineering — João Pedro Medeiros</title>
  <desc id="desc">Header escuro com circuitos e um painel de código, para o perfil GitHub de João Pedro Medeiros.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39d0c8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".24"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="circuits" width="120" height="90" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-opacity=".12">
        <path d="M0 22h32v20h26v-8h24M16 90V68h30V52h32V28h42M76 0v14h22v19h22"/>
        <path d="M0 76h16V58h18V38h16M120 65H96V51H76V37"/>
      </g>
      <g fill="#58a6ff" fill-opacity=".2">
        <circle cx="32" cy="22" r="2.5"/><circle cx="82" cy="34" r="2.5"/>
        <circle cx="46" cy="68" r="2.5"/><circle cx="98" cy="14" r="2.5"/>
      </g>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#circuits)"/>
  <ellipse cx="1000" cy="180" rx="310" ry="260" fill="url(#glow)"/>
  <path d="M0 330h410l28-28h80" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".55"/>
  <circle cx="520" cy="302" r="4" fill="#39d0c8"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="78" y="112" fill="#58a6ff" font-size="18" font-weight="700" letter-spacing="4">DATA ENGINEERING</text>
    <text x="76" y="190" fill="#f0f6fc" font-size="58" font-weight="700">Pipelines &amp; ETL</text>
    <text x="80" y="238" fill="#9fb4c8" font-size="24">Python  ·  SQL  ·  PySpark</text>
    <rect x="80" y="270" width="190" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <g transform="translate(748 65)">
    <rect width="370" height="230" rx="18" fill="#0b1220" stroke="#29445f" stroke-width="2"/>
    <path d="M18 0h334a18 18 0 0 1 18 18v24H0V18A18 18 0 0 1 18 0Z" fill="#152338"/>
    <circle cx="24" cy="21" r="5" fill="#ff7b72"/>
    <circle cx="43" cy="21" r="5" fill="#d29922"/>
    <circle cx="62" cy="21" r="5" fill="#3fb950"/>
    <text x="92" y="26" fill="#8297ad" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">pipeline.py</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="16">
      <text x="28" y="82" fill="#8b949e">01</text><text x="64" y="82" fill="#ff7b72">source</text><text x="126" y="82" fill="#c9d1d9"> = </text><text x="153" y="82" fill="#a5d6ff">read_api()</text>
      <text x="28" y="119" fill="#8b949e">02</text><text x="64" y="119" fill="#d2a8ff">clean</text><text x="112" y="119" fill="#c9d1d9"> = </text><text x="139" y="119" fill="#a5d6ff">transform(source)</text>
      <text x="28" y="156" fill="#8b949e">03</text><text x="64" y="156" fill="#79c0ff">load</text><text x="103" y="156" fill="#c9d1d9">(clean, </text><text x="173" y="156" fill="#a5d6ff">"warehouse"</text><text x="278" y="156" fill="#c9d1d9">)</text>
      <text x="28" y="193" fill="#8b949e">04</text><text x="64" y="193" fill="#3fb950">✓ data quality checked</text>
    </g>
    <path d="M315 76v114" stroke="#39d0c8" stroke-width="2" stroke-opacity=".6"/>
